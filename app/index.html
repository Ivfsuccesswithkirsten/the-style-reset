<title>The Style Reset</title>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
:root{
--paper:#F6EEEA; --card:#FFFDFB; --ink:#3A2620; --muted:#7D665E; --rose:#B9716C; --rose-soft:#EBD3CE; --oat:#E7DACD; --line:#E2D2C9; --ok:#4E7A5B; --on-rose:#FFFFFF;
--display:"Gloock", Georgia, "Times New Roman", serif;
--body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
--sign:"Mrs Saint Delafield", "Brush Script MT", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
--paper:#1D1614; --card:#271E1B; --ink:#F3E8E2; --muted:#B9A49B; --rose:#D99A94; --rose-soft:#47302D; --oat:#3A2E2A; --line:#3D302C; --ok:#8DC09C; --on-rose:#241614; color-scheme:dark}}
:root[data-theme="dark"]{
--paper:#1D1614; --card:#271E1B; --ink:#F3E8E2; --muted:#B9A49B; --rose:#D99A94; --rose-soft:#47302D; --oat:#3A2E2A; --line:#3D302C; --ok:#8DC09C; --on-rose:#241614; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:2.3rem}h2{font-size:1.65rem}h3{font-size:1.2rem}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sign{font-family:var(--sign);font-size:2.4rem;line-height:1;color:var(--rose)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:13px 22px;font-weight:600;background:var(--ink);color:var(--paper);transition:transform .12s ease, opacity .12s}
button:active{transform:scale(.98)}
.btn-rose{background:var(--rose);color:var(--on-rose)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-sm{padding:8px 14px;font-size:.86rem}
button:focus-visible,input:focus-visible,select:focus-visible,label.opt:focus-within{outline:2px solid var(--rose);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
label.field{display:flex;flex-direction:column;gap:6px;font-size:.86rem;font-weight:600}
.err{color:var(--rose);font-size:.86rem;min-height:1.2em}
.gate{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.gate-photo{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 25%;border-radius:18px;max-width:100%}
.ai-note{font-size:.75rem;color:var(--muted)}
.progress{height:4px;background:var(--oat);border-radius:4px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--rose);transition:width .3s ease}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
label.opt{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s, background .15s}
label.opt input{position:absolute;opacity:0;pointer-events:none;width:1px}
label.opt .tick{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);margin-top:2px;display:grid;place-items:center}
label.opt.multi .tick{border-radius:6px}
label.opt.on{border-color:var(--rose);background:var(--rose-soft)}
label.opt.on .tick{background:var(--rose);border-color:var(--rose)}
label.opt.on .tick::after{content:"";width:6px;height:10px;border:solid var(--on-rose);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:.84rem}
.quiz-nav{display:flex;justify-content:space-between;gap:10px}
.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--paper);display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin:0 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--paper)}
.tab{flex:none;background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 14px;font-size:.88rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hero-res{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center}
.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;object-position:50% 20%;max-width:100%}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--rose-soft);color:var(--ink);font-size:.8rem;font-weight:600}
.list{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.formula{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.formula:first-child{border-top:0;padding-top:0}
.formula .eq{font-weight:600}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;font-size:.8rem}
.sw i{display:block;aspect-ratio:1/1;border-radius:10px;border:1px solid var(--line);max-width:100%}
.quote{border-left:3px solid var(--rose);padding-left:14px}
.quote p{font-family:var(--display);font-size:1.15rem;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 12px;font-weight:500;font-size:.86rem}
.chip.on{background:var(--rose-soft);border-color:var(--rose)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line)}
.dot.neutral{background:var(--oat)}.dot.colour{background:var(--rose)}.dot.print{background:repeating-linear-gradient(45deg,var(--rose) 0 3px,var(--card) 3px 6px)}
.xbtn{background:transparent;color:var(--muted);padding:4px 8px;font-size:1.1rem;border-radius:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.outfits{display:grid;grid-template-columns:1fr;gap:12px}
.outfit{display:flex;flex-direction:column;gap:8px}
.outfit ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.outfit li{display:flex;gap:8px;align-items:center}
.outfit .why{font-size:.84rem;color:var(--muted)}
.day{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .num{font-family:var(--display);font-size:1.5rem;color:var(--rose);width:2ch}
.day.done h3{text-decoration:line-through;text-decoration-color:var(--rose)}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem;margin-top:8px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--rose)}
.meter{display:flex;gap:4px}.meter span{flex:1;height:6px;border-radius:3px;background:var(--oat)}.meter span.on{background:var(--rose)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.sample-flag{background:var(--rose-soft);border-radius:10px;padding:10px 12px;font-size:.84rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const P=PAL[S.result.palette];
return `
<div class="card stack"><h3>Buy these first</h3><p class="small muted">${budget==="0"?"No budget? Perfect. Try Vinted, a clothes swap or borrowing for this one piece. Everything else, you already have.":"The pieces that unlock the most new outfits with what you already own."}</p>
${first.length?`<ol class="list">${first.map(i=>`<li><b>${i.name}</b><br><span class="small muted">${shopTip(i,P)}</span></li>`).join("")}</ol>`:`<p>You own every core piece. Don't buy anything for a month. Wear what you have in new combinations.</p>`}</div>
${later.length?`<div class="card stack"><h3>Later, if you still want them</h3><ul class="list">${later.map(i=>`<li>${i.name}</li>`).join("")}</ul></div>`:""}
<div class="card stack"><h3>My shopping rules for you</h3><ul class="list"><li>Can you name three outfits it goes with? If not, leave it.</li><li>Neutrals from your palette first, colour second.</li><li>Sit down in it in the changing room.</li><li>One in, one out.</li></ul></div>
<p class="small muted">Tick pieces as owned in the Wardrobe tab and this list updates.</p>`}
function shopTip(i,P){
const n=P.neutrals.map(x=>x[0].toLowerCase());
if(i.cat==="top"&&i.col!=="neutral")return `Try it in ${P.colours[0][0].toLowerCase()} or ${P.colours[1][0].toLowerCase()}.`;
if(["layer","bottom","shoes","bag"].includes(i.cat))return `Choose ${n[0]} or ${n[1]} so it goes with everything.`;
return `In ${n[3]||n[0]} or ${n[0]}.`;
}
function bind(){
const gf=$("#gateForm");
if(gf) gf.addEventListener("submit",e=>{e.preventDefault();
const email=$("#email").value.trim(), code=$("#code").value.trim().toUpperCase();
if(code===CONFIG.demoCode){loadSample();return}
if(!/^[^ @]+@[^ @]+[.][^ @]+$/.test(email)){$("#gateErr").textContent="Enter the email address you used at checkout.";return}
if(!CONFIG.accessCodes.includes(code)){$("#gateErr").textContent="That code doesn't match. Check your welcome email, or contact "+CONFIG.supportEmail+".";return}
S.unlocked=true;S.email=email;save();view="quiz";render();window.scrollTo(0,0)});
if(view==="quiz"){
const q=QUESTIONS[S.step];
if(q.type==="text"){const inp=$("#q_"+q.id);inp.focus();inp.addEventListener("input",()=>{S.answers[q.id]=inp.value;save();$("#next").disabled=!inp.value.trim()});
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&inp.value.trim())next()})}
document.querySelectorAll(".opts input").forEach(inp=>inp.addEventListener("change",()=>{
if(q.type==="single"){S.answers[q.id]=inp.value;save();render();return}
let arr=S.answers[q.id]||[];
if(inp.checked){if(arr.length>=q.max){inp.checked=false;toast("Up to "+q.max+" please");return}arr=[...arr,inp.value]}else arr=arr.filter(v=>v!==inp.value);
S.answers[q.id]=arr;save();render()}));
$("#back").onclick=()=>{S.step=Math.max(0,S.step-1);save();render()};
$("#next").onclick=next;
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();const t=document.querySelector(".tabs");t&&t.scrollIntoView({block:"start"})});
const rt=$("#retake");if(rt)rt.onclick=()=>{S.step=0;S.result=null;S.sample=false;save();view=S.unlocked?"quiz":"gate";render();window.scrollTo(0,0)};
const sr=$("#startReal");if(sr)sr.onclick=()=>{S={unlocked:false,email:"",answers:{},step:0,result:null,wardrobe:[],days:[],saved:[],sample:false};save();view="gate";render()};
document.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>{
const id=b.dataset.quick, ex=S.wardrobe.find(i=>i.from===id);
if(ex){S.wardrobe=S.wardrobe.filter(i=>i.from!==id)}
else{const src=id.startsWith("s")?{...SIGNATURE[S.result.primary][+id.slice(1)]}:CAPSULE.find(c=>c.id===id);
S.wardrobe.push({id:"w"+Date.now()+Math.random().toString(36).slice(2,6),from:id,name:src.name,cat:src.cat,col:src.col,vibe:src.vibe})}
save();render()});
const af=$("#addForm");if(af)af.addEventListener("submit",e=>{e.preventDefault();const n=$("#iname").value.trim();if(!n){$("#iname").focus();return}
S.wardrobe.push({id:"w"+Date.now(),name:n,cat:$("#icat").value,col:$("#icol").value,vibe:$("#ivibe").value});save();render();toast("Added "+n)});
document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.wardrobe=S.wardrobe.filter(i=>i.id!==b.dataset.del);save();render()});
document.querySelectorAll("[data-occ]").forEach(b=>b.onclick=()=>{occasion=b.dataset.occ;render()});
const sh=$("#shuffle");if(sh)sh.onclick=()=>{seed=Math.floor(Math.random()*1e6)+1;render()};
document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{const s=decodeURIComponent(b.dataset.save);if(!S.saved.includes(s))S.saved.push(s);save();render();toast("Outfit saved")});
document.querySelectorAll("[data-unsave]").forEach(b=>b.onclick=()=>{S.saved.splice(+b.dataset.unsave,1);save();render()});
document.querySelectorAll("[data-day]").forEach(c=>c.onchange=()=>{S.days[+c.dataset.day]=c.checked;save();render()});
}
function next(){
if(S.step<QUESTIONS.length-1){S.step++;save();render();window.scrollTo(0,0);return}
S.result=compute(S.answers);save();view="results";tab="profile";render();window.scrollTo(0,0);
}
function loadSample(){
S={unlocked:true,email:"",step:0,sample:true,days:[true,true,false,false,false,false,false],saved:[],
answers:{name:"Example",week:"home",grab:"RC",words:["RC","PM","SF"],reach:["RC","comfort"],pain:"frumpy",veins:"neutral",metal:"warm",hair:"medium",contrast:"medium",fit:["waist","tummy","legs"],budget:"100"},
wardrobe:[]};
S.result=compute(S.answers);
["c1","c3","c4","c5","c8","c9","c11"].forEach(id=>{const c=CAPSULE.find(x=>x.id===id);S.wardrobe.push({id:"w"+id,from:id,name:c.name,cat:c.cat,col:c.col,vibe:c.vibe})});
S.wardrobe.push({id:"wx1",name:"Green cashmere jumper",cat:"top",col:"colour",vibe:"both"});
save();view="results";tab="profile";render();
}
render();
</script>
</body>
</html>
